name: security-gate

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (C#)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          queries: security-and-quality

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build (for CodeQL)
        run: dotnet build src/PayGod.sln --configuration Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  dependency_review:
    name: Dependency Review (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    name: SBOM (PR artifact)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install CycloneDX tool
        run: dotnet tool install --global CycloneDX

      - name: Generate SBOM (CycloneDX)
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          mkdir -p artifacts/sbom
          dotnet CycloneDX src/PayGod.sln -o artifacts/sbom/sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: artifacts/sbom/sbom.cdx.json
          if-no-files-found: error

  security-gate:
    name: security-gate
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [codeql, dependency_review, gitleaks, sbom]
    steps:
      - name: Propagate security job failures
        shell: bash
        run: |
          echo "codeql=${{ needs.codeql.result }}"
          echo "dependency_review=${{ needs.dependency_review.result }}"
          echo "gitleaks=${{ needs.gitleaks.result }}"
          echo "sbom=${{ needs.sbom.result }}"

          if [[ "${{ needs.codeql.result }}" != "success" || \
                "${{ needs.dependency_review.result }}" != "success" || \
                "${{ needs.gitleaks.result }}" != "success" || \
                "${{ needs.sbom.result }}" != "success" ]]; then
            echo "security-gate: one or more required security jobs did not succeed."
            exit 1
          fi

          echo "security-gate passed."
