name: Trivy Native Source vs PayGod Shadow (Research Only)

# Isolated optional *public image* native source witness; not on main,
# not a release gate and never a Kernel-authorized deployment.
on:
  push:
    branches:
      - research/trivy-readonly-preflight-shadow-20261016
    paths:
      - .github/workflows/trivy-native-source-shadow.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-trivy-shadow:
    name: Native Trivy saved report and shadow comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned Trivy binary version via SHA-pinned official setup
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.75.0
          cache: false

      - name: Pull public test image and record immutable repo digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-source
          docker pull docker.io/library/alpine:3.21
          subject="$(docker image inspect --format='{{index .RepoDigests 0}}' docker.io/library/alpine:3.21)"
          case "$subject" in
            *@sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "::error::Public image had no pinned repo digest"; exit 1 ;;
          esac
          printf '%s\n' "$subject" > native-source/subject.txt
          echo "Native public image subject recorded: $subject"

      - name: Produce actual native Trivy JSON and write untrusted-source run metadata
        shell: bash
        run: |
          set -euo pipefail
          trivy --version | tee native-source/trivy-version.txt
          subject="$(cat native-source/subject.txt)"
          trivy image --scanners vuln --format json --exit-code 0 \
            --output native-source/trivy.json "$subject" \
            2>&1 | tee native-source/trivy.log
          printf '%s\n' "$?" > native-source/trivy-exit.txt
          sha256sum native-source/trivy.json > native-source/report-sha256.txt
          sha256sum .github/workflows/trivy-native-source-shadow.yml > native-source/workflow-sha256.txt
          printf '%s\n' "$GITHUB_SHA" > native-source/workflow-commit.txt
          echo 'Native scanner produced JSON at observed branch SHA; this alone does not prove full scan coverage or issuer authenticity.'

      - name: "Read only shadow: never translate into a PayGod decision or receipt"
        shell: bash
        run: |
          set -euo pipefail
          subject="$(cat native-source/subject.txt)"
          python3 tools/eik_trivy_shadow.py \
            --report native-source/trivy.json \
            --expected-artifact "$subject" \
            --scanner-exit-code "$(cat native-source/trivy-exit.txt)" \
            --scanner-arg=image \
            --scanner-arg=--scanners=vuln \
            --scanner-arg=--format=json \
            | tee native-source/paygod-shadow-diagnostic.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          diag = json.loads(Path("native-source/paygod-shadow-diagnostic.json").read_text())
          assert diag["kernel_called"] is False
          assert diag["receipt_issued"] is False
          assert diag["source_attested"] is False
          assert diag["paygod_decision"] is None
          assert diag["status"] in ("WITHHELD_NOT_RUN", "SHADOW_BLOCK_CANDIDATE")
          print("Bounded shadow status:", diag["status"], "Reasons:", diag["reason_codes"])
          PY

      - name: Publish ONLY public-image report and non-authoritative diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-trivy-public-image-shadow
          path: native-source/
          retention-days: 7
          if-no-files-found: error
