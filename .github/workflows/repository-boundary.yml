name: Repository Boundary Gate

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'api/**'
      - 'tools/check_repository_boundary.py'
      - 'tests/boundary/**'
      - 'docs/REPOSITORY_BOUNDARY.md'
      - '.github/workflows/repository-boundary.yml'
  push:
    branches: [ main ]
    paths:
      - 'api/**'
      - 'tools/check_repository_boundary.py'
      - 'tests/boundary/**'
      - 'docs/REPOSITORY_BOUNDARY.md'
      - '.github/workflows/repository-boundary.yml'

jobs:
  boundary:
    name: Repository Boundary Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Positive witness - thin adapter accepted
        run: python3 tools/check_repository_boundary.py --contract tests/boundary/valid-adapter.json --expect pass
      - name: Negative witness - alternate authority rejected
        run: python3 tools/check_repository_boundary.py --contract tests/boundary/alternate-authority.json --expect reject
      - name: Current adapter surfaces
        run: python3 tools/check_repository_boundary.py --scan-current
