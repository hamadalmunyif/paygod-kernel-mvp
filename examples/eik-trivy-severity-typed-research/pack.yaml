api_version: "paygod/v1"
kind: Pack
metadata:
  name: "trivy-typed-severity-nonpermit-experiment"
  version: "2.1.0"
  description: "Research-only composition test for typed-v1 and Trivy severity deny/flag; never authorizes release."
  maintainer: "PayGod research"
  tags: ["research", "security", "read-only", "nonpermit"]
spec:
  inputs:
    - name: "scan_report"
      type: "observation"
      source: "trivy-shadow-normalized-research"
      schema:
        type: "object"
        additionalProperties: false
        required: ["artifact_name", "vulnerabilities"]
        properties:
          artifact_name:
            type: "string"
            pattern: "^.+@sha256:[a-f0-9]{64}$"
          vulnerabilities:
            type: "array"
            items:
              type: "object"
              additionalProperties: false
              required: ["cve_id", "severity", "installed_version", "trivy_status"]
              properties:
                cve_id: { type: "string", minLength: 1 }
                severity:
                  type: "string"
                  enum: ["CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN"]
                installed_version: { type: "string", minLength: 1 }
                trivy_status: { type: "string" }
  policy:
    evaluation_profile: "typed-v1"
    rules:
      - name: "block-observed-high-critical"
        condition: "input.scan_report.vulnerabilities.any(v => v.severity == 'CRITICAL' or v.severity == 'HIGH')"
        decision: "deny"
        reason: "Observed HIGH or CRITICAL findings in research source; scanner-native equivalent blocking exists."
      - name: "flag-observed-medium"
        condition: "input.scan_report.vulnerabilities.any(v => v.severity == 'MEDIUM')"
        decision: "flag"
        reason: "Observed MEDIUM findings; no release authorization."
